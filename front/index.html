<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRODUCT MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <header>
      <span>PRODUCT MANAGEMENT SYSTEM</span>
      <h1>상품 관리 대시보드</h1>
      <span>상품 등록부터 재고 관리까지 한 곳에서 관리합니다.</span>
    </header>
    <div class="container">
      <div class="contents statistic">
        <div class="content">
          <span>전체 상품</span>
          <span id="totalProducts">0</span>
          <span>개</span>
        </div>
        <div class="content">
          <span>총 재고 수량</span>
          <span id="totalQuantity">0</span>
          <span>개</span>
        </div>
        <div class="content">
          <span>재고 부족</span>
          <span id="lowStockCount">0</span>
          <span>개 상품</span>
        </div>
        <div class="content">
          <span>재고 자산 금액</span>
          <span id="inventoryValue">0</span>
          <span>원</span>
        </div>
      </div>
      <div class="contents productSearch">
        <div>
          <span>상품 목록</span>
          <span id="productCount">0개</span>
        </div>
        <div>
          <input
            id="productSearchInput"
            type="search"
            placeholder="상품명 또는 상품 코드 검색"
            aria-label="상품명 또는 상품 코드 검색"
          />
          <button id="createProductButton" type="button">+ 상품 등록</button>
          <a href="./trash.html">삭제 상품 목록</a>
        </div>
      </div>
      <div class="contents productSort">
        <label for="sortField">정렬 기준</label>
        <select id="sortField">
          <option value="price">가격</option>
          <option value="quantity">재고</option>
        </select>
        <button id="sortProductsButton" type="button">오름차순</button>
      </div>
      <div class="contents productList">
        <p id="apiError" role="alert" hidden></p>
        <div class="page">
          <button type="button" id="previousPage">이전</button>
          <span id="pageIndicator">1 / 1</span>
          <button type="button" id="nextPage">다음</button>
        </div>
      </div>
    </div>
    <dialog id="productDialog">
      <form id="productForm">
        <h2 id="productDialogTitle">상품 등록</h2>
        <p id="productDialogError" role="alert" hidden></p>
        <label>
          상품 코드
          <input name="code" type="text" maxlength="20" required />
        </label>
        <label>
          상품명
          <input name="name" type="text" maxlength="100" required />
        </label>
        <label>
          카테고리
          <input name="category" type="text" maxlength="50" required />
        </label>
        <label>
          가격
          <input name="price" type="number" min="0" step="1" required />
        </label>
        <label>
          재고 수량
          <input name="quantity" type="number" min="0" step="1" required />
        </label>
        <label>
          최소 재고 수량
          <input name="min_quantity" type="number" min="0" step="1" required />
        </label>
        <label>
          공급업체
          <input name="supplier" type="text" maxlength="100" required />
        </label>
        <div class="dialogButtons">
          <button id="cancelProductButton" type="button">취소</button>
          <button id="saveProductButton" type="submit">저장</button>
        </div>
      </form>
    </dialog>
    <script src="./js/api.js" defer></script>
    <script src="./js/index.js" defer></script>
  </body>
</html>
