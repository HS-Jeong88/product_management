<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삭제 상품 목록 | PRODUCT MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <header>
      <span>PRODUCT MANAGEMENT SYSTEM</span>
      <h1>삭제 상품 목록</h1>
      <span>삭제한 상품을 복원하거나 영구 삭제할 수 있습니다.</span>
    </header>
    <div class="container">
      <div class="contents productSearch">
        <div>
          <span>삭제 상품</span>
          <span id="deletedProductCount">0개</span>
        </div>
        <div>
          <input
            id="deletedProductSearchInput"
            type="search"
            placeholder="상품명 또는 상품 코드 검색"
            aria-label="삭제 상품명 또는 상품 코드 검색"
          />
          <a href="./index.html">상품 목록으로</a>
        </div>
      </div>
      <div class="contents productSort">
        <label for="deletedSortField">정렬 기준</label>
        <select id="deletedSortField">
          <option value="price">가격</option>
          <option value="quantity">재고</option>
        </select>
        <button id="sortDeletedProductsButton" type="button">오름차순</button>
      </div>
      <div class="contents productList">
        <p id="deletedApiError" role="alert" hidden></p>
        <div class="page">
          <button type="button" id="previousDeletedPage">이전</button>
          <span id="deletedPageIndicator">1 / 1</span>
          <button type="button" id="nextDeletedPage">다음</button>
        </div>
      </div>
    </div>
    <script src="./js/api.js" defer></script>
    <script src="./js/trash.js" defer></script>
  </body>
</html>
